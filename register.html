<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page - Spendora</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <form action="">
        <legend>Join Us Today!</legend>
        <br><br>

        <label for="fullname">Full Name:</label>
        <input type="text" placeholder="Enter your full name" id="fullname" required></input>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="Enter your email" id="email" required></input>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" placeholder="Enter your password" id="password" required></input>
        <br><br>

        <label for="birthdate">Birth Date:</label>
        <input type="date" id="birthdate" required> </input>
        <br><br>

        <label for="dt">Date and Time:</label>
        <input type="datetime-local" id="dt" required> </input>
        <br><br>

        <label for="phone"> phone Number:</label>
        <input type="tel" placeholder="Enter your phone number" id="phone" required>
        <br><br>

        <label> upload file:</label>
        <input type="file" id="file" required>
        <br><br>

        <!--Dropdown-->
        <!--Radio Buttons-->
        <!--Checkboxes-->
        <!--text areas-->

        <button type="submit">Register</button>

    </form>
    
</body>
</html>
