<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee</title>

    <style>

        h1 {
            color: #333;
            text-align: center;
            text-decoration: underline;
        }

        table, th {
            border: 2px solid black;
            border-collapse: collapse;
        }
        
        table{
            
            width: 100%;
            height: 300px;
            background-color: #f2f2f2;
        }
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>


</head>
<body>
    <h1>Employee Information</h1>

    <p>This is a simple employee information page. 
        It contains basic information about each employee. </p>

    <table>
        <tr>
            <th>No.</th>
            <th>Full Name</th>
            <th>Position</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Bill Gates</td>
            <td>Founder Microsoft</td>
            <td>$1000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Steve Jobs</td>
            <td>Founder Apple</td>
            <td>$1500</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Larry Page</td>
            <td>Founder Google</td>
            <td>$2000</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Mark Zuckerberg</td>
            <td>Founder Facebook</td>
            <td>$2500</td>
    </table>


</body>
</html>
